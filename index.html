<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>DekView - Receptor de Segunda Tela</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f12;
      color: #f1f3f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    }

    /* Tela Inicial / Conexão */
    #setup-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1b2028 0%, #0c0e12 100%);
      z-index: 50;
      transition: opacity 0.3s ease, visibility 0.3s;
      padding: 16px;
    }

    #setup-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px 24px;
      background: rgba(25, 30, 39, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      margin-bottom: 12px;
      border: 1px solid rgba(59, 130, 246, 0.25);
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(15, 18, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    .protocol-select {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .protocol-option {
      flex: 1;
      padding: 9px;
      background: rgba(15, 18, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      color: #94a3b8;
      transition: all 0.2s;
    }

    .protocol-option.active {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: transform 0.15s, opacity 0.2s, box-shadow 0.2s;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-install {
      display: none;
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 10px;
      background: rgba(59, 130, 246, 0.1);
      color: #60a5fa;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-install:hover {
      background: rgba(59, 130, 246, 0.2);
    }

    .status-msg {
      margin-top: 14px;
      font-size: 12px;
      color: #e2e8f0;
      min-height: 18px;
    }

    /* Container de visualização (100% da tela) */
    #display-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      touch-action: none;
      cursor: crosshair;
    }

    #stream-video, #stream-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    /* HUD flutuante */
    #hud-controls {
      position: fixed;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 40;
      opacity: 0.15;
      transition: opacity 0.25s ease;
    }

    #hud-controls:hover {
      opacity: 1;
    }

    .hud-btn {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    #info-bar {
      position: fixed;
      bottom: 8px;
      left: 12px;
      font-family: monospace;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      z-index: 40;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Tela Inicial Minimalista -->
  <div id="setup-overlay">
    <div class="card">
      <div class="badge">DekView Receiver</div>
      <h1>Segunda Tela</h1>
      <p class="subtitle">Insira o endereço do host para iniciar o streaming</p>

      <div class="input-group">
        <label for="host-input">Endereço do Host (IP ou localhost:porta)</label>
        <div class="input-row">
          <input type="text" id="host-input" value="192.168.1.9:8080" placeholder="ex: 192.168.1.9:8080" autocomplete="off" spellcheck="false">
        </div>
      </div>

      <div class="protocol-select">
        <div class="protocol-option active" data-proto="ws">WebSocket Stream</div>
        <div class="protocol-option" data-proto="webrtc">WebRTC</div>
      </div>

      <button id="btn-connect" class="btn-primary">Conectar & Tela Cheia</button>
      <button id="btn-install-app" class="btn-install">📲 Instalar App no Tablet / Celular</button>
      <div id="status-msg" class="status-msg"></div>
    </div>
  </div>

  <!-- HUD Flutuante -->
  <div id="hud-controls">
    <button id="btn-fullscreen" class="hud-btn">Tela Cheia</button>
    <button id="btn-disconnect" class="hud-btn">Desconectar</button>
  </div>

  <div id="info-bar">Pointer: - | FPS: -</div>

  <!-- Área de Exibição / Entrada (Toque, Caneta, Clique) -->
  <div id="display-container">
    <video id="stream-video" autoplay playsinline muted style="display: none;"></video>
    <canvas id="stream-canvas"></canvas>
  </div>

  <script src="app.js"></script>
</body>
</html>
